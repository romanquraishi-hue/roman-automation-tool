<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { background:#0d1117; color:white; }
</style>
</head>

<body class="p-4">

<h1 class="text-xl mb-4">📂 Document Dashboard</h1>

<input type="file" id="fileInput" class="mb-3">

<button onclick="uploadFile()" class="bg-yellow-500 px-4 py-2 rounded">
Upload
</button>

<div id="files" class="mt-5 space-y-2"></div>

<script>
const supabaseUrl = "https://kqyofnstpuiwnpaftuhw.supabase.co";
const supabaseKey = "sb_publishable_J82ULaoZUMkn69nzu3tvAg_jiZc7X7n";

const client = supabase.createClient(supabaseUrl, supabaseKey);

// Upload
async function uploadFile(){
const file = document.getElementById("fileInput").files[0];

if(!file){
alert("Select file first");
return;
}

const fileName = Date.now() + "_" + file.name;

const { data, error } = await client.storage
.from("documents")
.upload(fileName, file);

if(error){
alert(error.message);
return;
}

// Get public URL
const { data: urlData } = client.storage
.from("documents")
.getPublicUrl(fileName);

// Save DB
await client.from("files").insert({
file_name: file.name,
file_url: urlData.publicUrl
});

loadFiles();
}

// Load files
async function loadFiles(){
const { data } = await client.from("files").select("*");

let html = "";

data.forEach(f=>{
html += `
<div class="border p-2 rounded">
📄 ${f.file_name}
<a href="${f.file_url}" target="_blank" class="text-yellow-400 ml-2">Download</a>
</div>
`;
});

document.getElementById("files").innerHTML = html;
}

loadFiles();
</script>

</body>
</html>
